<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>테니스협회 · 샘플</title>
<script>try{sessionStorage.removeItem('forcePC')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f5f1e8; --surface:#fffdf8; --surface-2:#efe9dd; --ink:#1b2320; --ink-2:#5f655f; --line:#e2dacb;
  --court:#1f4a3a; --court-deep:#132b23; --court-ink:#ffffff; --surround:#24412f; --ball:#c6a15b; --ball-ink:#1d1a12;
  --ok:#2f6b47; --warn:#93641a; --bad:#a43d34; --ok-bg:#e5eee3; --warn-bg:#f4ead6; --bad-bg:#f5e2de; --info-bg:#e4ebe5;
  --radius:4px; --shadow:0 1px 0 rgba(27,35,32,.04),0 18px 40px -26px rgba(27,35,32,.4);
  --gold:#c6a15b; --gold-deep:#a8843f; --court-surface:#3b6680; --serif:"Noto Serif KR","Nanum Myeongjo",serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--court-deep)}
a{color:var(--court)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--court-deep);color:#fff}
.top .wrap{display:flex;align-items:center;gap:18px;height:60px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;font-size:17px;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.75;line-height:1.1}
.brand-mark{width:30px;height:30px;border-radius:50%;background:var(--ball);position:relative;flex:none}
.brand-mark::before,.brand-mark::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #fff;clip-path:inset(0 60% 0 0)}
.brand-mark::after{clip-path:inset(0 0 0 60%)}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{color:#dfe8f2;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:14px;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.nav a.admin{border:1px solid rgba(255,255,255,.3);margin-left:6px}
.nav a.admin.on{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px}
@media (max-width:860px){
  .menu-btn{display:block}
  .nav{position:absolute;top:60px;left:0;right:0;background:var(--court-deep);flex-direction:column;padding:8px 12px 14px;display:none;margin:0}
  .nav.open{display:flex}
  .nav a.admin{margin:6px 0 0}
}
.admin-strip{background:var(--ball);color:var(--ball-ink);font-size:13px}
.admin-strip .wrap{display:flex;gap:4px;align-items:center;overflow-x:auto;height:42px;scrollbar-width:none}
.admin-strip a{color:var(--ball-ink);text-decoration:none;padding:5px 10px;border-radius:6px;white-space:nowrap;font-weight:500}
.admin-strip a.on{background:rgba(0,0,0,.12);font-weight:700}
.admin-strip .who{margin-left:auto;white-space:nowrap;padding-left:12px}
.admin-strip button{background:none;border:1px solid rgba(0,0,0,.3);border-radius:6px;padding:2px 8px;margin-left:6px;cursor:pointer}

main{padding:28px 0 64px;min-height:70vh}
h1{font-size:28px;line-height:1.25;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:20px;line-height:1.3;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 8px}
.lede{color:var(--ink-2);margin:0 0 22px}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.page-head p{margin:0;color:var(--ink-2)}

/* hero: the court */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:stretch;margin-bottom:34px}
.hero-copy{display:flex;flex-direction:column;justify-content:center}
.hero-copy h1{font-size:clamp(28px,4.4vw,44px);line-height:1.18;margin-bottom:14px}
.hero-copy p{color:var(--ink-2);font-size:16px;margin:0 0 20px;max-width:34em}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px}
.court-board{background:var(--surround);border-radius:14px;padding:18px;color:#fff;box-shadow:var(--shadow)}
.court-board-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px}
.court-board-head b{font-size:15px}
.court-board-head span{font-size:12px;opacity:.8}
.courts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.court{position:relative;background:var(--court);aspect-ratio:.62;border-radius:4px;overflow:hidden;font-size:11px;line-height:1.3}
.court::before{content:"";position:absolute;inset:7%;border:1.5px solid rgba(255,255,255,.85)}
.court::after{content:"";position:absolute;left:4%;right:4%;top:50%;border-top:2px solid rgba(255,255,255,.95)}
.court .cl{position:absolute;left:20%;right:20%;top:28%;bottom:28%;border-left:1.5px solid rgba(255,255,255,.7);border-right:1.5px solid rgba(255,255,255,.7)}
.court .cl::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1.5px solid rgba(255,255,255,.7)}
.court .cl::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;border-top:1.5px solid rgba(255,255,255,.7);border-bottom:1.5px solid rgba(255,255,255,.7)}
.court .no{position:absolute;top:9%;left:10%;font-weight:700;font-size:12px;z-index:2}
.court .side{position:absolute;left:10%;right:10%;z-index:2;background:rgba(15,40,70,.78);padding:3px 5px;border-radius:3px;text-align:center}
.court .side.a{top:31%}
.court .side.b{bottom:31%}
.court .live{position:absolute;right:8%;top:8%;z-index:2;background:var(--ball);color:var(--ball-ink);font-weight:700;border-radius:3px;padding:0 5px;font-size:10px}
.court .idle{position:absolute;inset:0;display:grid;place-items:center;z-index:2;opacity:.7}
@media (max-width:860px){.hero{grid-template-columns:1fr}.courts{grid-template-columns:repeat(4,1fr);gap:7px}.court{font-size:9.5px}}

/* blocks */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:860px){.grid-2,.grid-3{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.panel+.panel{margin-top:16px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.panel-head h2,.panel-head h3{margin:0}
.panel-head a{font-size:13px;text-decoration:none}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .meta{color:var(--ink-2);font-size:13px;white-space:nowrap}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media (max-width:700px){.stat-row{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat b{display:block;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{color:var(--ink-2);font-size:13px}

/* tournament cards */
.t-item{display:grid;grid-template-columns:76px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.t-item:first-child{border-top:0}
.t-date{background:var(--court);color:#fff;border-radius:8px;text-align:center;padding:8px 4px;line-height:1.15}
.t-date b{display:block;font-size:24px}
.t-date span{font-size:12px;opacity:.85}
.t-item h3{margin:0 0 2px;font-size:16px}
.t-item p{margin:0;color:var(--ink-2);font-size:13px}
@media (max-width:620px){.t-item{grid-template-columns:60px 1fr}.t-item .t-act{grid-column:1/-1}}

/* buttons, forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--court);border-color:var(--court);color:#fff}
.btn.primary:hover{background:var(--court-deep)}
.btn.ball{background:var(--ball);border-color:var(--ball);color:var(--ball-ink);font-weight:700}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.lg{padding:12px 20px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-2)}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=password],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:40px}
textarea{min-height:90px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.form-row{grid-template-columns:1fr}}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{max-width:240px}
.toolbar select{width:auto}
.toolbar .sp{flex:1}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface-2);font-weight:600;font-size:13px;color:var(--ink-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
tr.hl td{background:var(--info-bg)}
tr.adv td:first-child{box-shadow:inset 3px 0 0 var(--ok)}

/* tags */
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.info{background:var(--info-bg);color:var(--court)}
.tag.ball{background:var(--ball);color:var(--ball-ink)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a,.tabs button{padding:10px 14px;text-decoration:none;color:var(--ink-2);border:0;background:none;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;font-size:14px}
.tabs .on{color:var(--ink);border-bottom-color:var(--court);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--court);border-color:var(--court);color:#fff}

/* groups */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.group-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.group-card h3{margin:0;padding:10px 14px;background:var(--surface-2);font-size:15px;display:flex;justify-content:space-between}
.group-card table{font-size:13px}
.group-card th,.group-card td{padding:7px 8px}
.team{display:flex;flex-direction:column;line-height:1.3}
.team small{color:var(--ink-2);font-size:11.5px}

/* bracket */
.bracket-scroll{overflow-x:auto;padding-bottom:10px}
.bracket{display:flex;gap:28px;min-width:max-content;align-items:stretch}
.b-round{display:flex;flex-direction:column;min-width:210px}
.b-round h4{margin:0 0 8px;font-size:13px;color:var(--ink-2);text-align:center}
.b-col{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:12px}
.b-match{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px;position:relative}
.b-match .slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px}
.b-match .slot+.slot{border-top:1px solid var(--line)}
.b-match .slot.win{font-weight:700;background:var(--ok-bg)}
.b-match .slot .sc{font-variant-numeric:tabular-nums;font-weight:700;min-width:16px;text-align:right}
.b-match .slot.tbd{color:var(--ink-2)}
.b-meta{font-size:11px;color:var(--ink-2);padding:3px 10px;background:var(--surface-2)}
.champion{background:var(--ball);color:var(--ball-ink);border-radius:8px;padding:12px;text-align:center;font-weight:700}

/* match cards */
.m-card{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.m-when{text-align:center;min-width:64px}
.m-when b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.m-when span{font-size:12px;color:var(--ink-2)}
.m-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.m-vs .t2{text-align:right}
.m-score{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:620px){.m-card{grid-template-columns:1fr}.m-when{display:flex;gap:10px;align-items:baseline;text-align:left}}

/* result entry */
.res-row{display:grid;grid-template-columns:110px 1fr 140px 1fr 90px;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.res-row:first-child{border-top:0}
.res-row .r-t2{text-align:right}
.res-row .r-sc{display:flex;gap:6px;align-items:center;justify-content:center}
.res-row .r-sc input{width:48px;text-align:center;padding:6px;min-height:36px}
.res-row.done{background:var(--surface-2)}
.res-meta{font-size:12px;color:var(--ink-2);line-height:1.35}
@media (max-width:760px){.res-row{grid-template-columns:1fr 1fr}.res-row .res-meta{grid-column:1/-1}.res-row .r-sc{grid-column:1/-1}.res-row .r-act{grid-column:1/-1}.res-row .r-t2{text-align:left}}

/* schedule grid */
.sched{border-collapse:separate;border-spacing:0}
.sched th,.sched td{border-right:1px solid var(--line);vertical-align:top;white-space:normal;min-width:150px}
.sched th:first-child,.sched td:first-child{min-width:70px;position:sticky;left:0;background:var(--surface-2);z-index:1}
.cell{font-size:12px;line-height:1.35;border-radius:6px;padding:6px 8px;background:var(--info-bg)}
.cell.done{background:var(--ok-bg)}
.cell b{font-size:11px;color:var(--ink-2);font-weight:600;display:block}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,28,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 20px 50px -10px rgba(0,0,0,.4)}
.modal h2{margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:90vw}
.empty{padding:28px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
.note{background:var(--info-bg);border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.note.warn{background:var(--warn-bg)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;font-size:13px}
.steps span{padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.steps span.done{background:var(--ok-bg);color:var(--ok);font-weight:600}
.steps span.now{background:var(--court);color:#fff;font-weight:600}
footer{background:var(--surface-2);color:var(--ink-2);font-size:13px;padding:26px 0}
footer b{color:var(--ink)}
.login{max-width:380px;margin:30px auto}
.rank-1 td:first-child,.rank-2 td:first-child,.rank-3 td:first-child{font-weight:700}
.medal{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);font-size:12px;font-weight:700}
.rank-1 .medal{background:var(--ball);color:var(--ball-ink)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.right{text-align:right}
.mt{margin-top:18px}
.mb0{margin-bottom:0}

.brand-logo{width:32px;height:32px;flex:none;display:block}
.hero2{position:relative;border-radius:16px;overflow:hidden;min-height:380px;display:flex;align-items:center;margin-bottom:18px;color:#fff;background:#173f6c}
.hero2>svg{position:absolute;inset:0;width:100%;height:100%}
.hero2::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(12,30,52,.9) 0%,rgba(12,30,52,.55) 42%,rgba(12,30,52,0) 70%)}
.hero-txt{position:relative;z-index:2;padding:36px;max-width:560px}
.hero-txt h1{font-size:clamp(30px,4.6vw,46px);margin-bottom:10px}
.hero-txt p{opacity:.92;margin:0 0 20px;font-size:16px}
.eyebrow{font-size:12px;letter-spacing:.14em;opacity:.8;display:block;margin-bottom:8px}
.hero2 .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.45)}
.hero2 .btn.primary{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
@media (max-width:700px){.hero2{min-height:460px;align-items:flex-end}.hero2>svg{height:70%}.hero2::before{background:linear-gradient(0deg,rgba(12,30,52,1) 0%,rgba(12,30,52,.85) 42%,rgba(12,30,52,0) 70%)}.hero-txt{padding:22px}}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
.quick a{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-decoration:none;color:var(--ink);font-weight:600;line-height:1.35}
.quick a:hover{border-color:var(--court)}
.quick svg{width:36px;height:36px;flex:none}
.quick small{display:block;font-weight:400;color:var(--ink-2);font-size:12px}
@media (max-width:760px){.quick{grid-template-columns:repeat(2,1fr)}.quick a{padding:12px}}
.live-wrap{display:grid;grid-template-columns:270px 1fr;gap:18px;margin-bottom:26px}
.live-info h3{margin:10px 0 4px;font-size:16px}
.live-poster{width:84px;margin-top:10px}.live-poster svg{display:block;width:100%;border-radius:6px}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:12px 0 4px}.progress span{display:block;height:100%;background:var(--court)}
@media (max-width:860px){.live-wrap{grid-template-columns:1fr}}
.t-poster{width:76px}.t-poster svg{width:100%;height:auto;display:block;border-radius:6px;box-shadow:var(--shadow)}
.venues{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.venue{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-decoration:none;color:var(--ink);display:flex;flex-direction:column}
.venue:hover{border-color:var(--court)}
.venue-art{position:relative;aspect-ratio:2/1}.venue-art svg{width:100%;height:100%;display:block}

<script>
/* ============ 기본 유틸 ============ */
const KEY='tennis-demo-v2';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const fmtWon=n=>n.toLocaleString('ko-KR')+'원';
const WD=['일','월','화','수','목','금','토'];
const dObj=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtDate=s=>{const d=dObj(s);return `${d.getMonth()+1}.${d.getDate()}(${WD[d.getDay()]})`};
const fmtDateLong=s=>{const d=dObj(s);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`};
const TODAY='2026-10-22';
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ============ 샘플 데이터 생성 ============ */
function seed(){
  const R=mulberry(20261022), pick=a=>a[Math.floor(R()*a.length)], rint=(a,b)=>a+Math.floor(R()*(b-a+1));
  const SUR='김이박최정강조윤장임한오서신권황안송류홍전고문양손배백허남심노'.split('');
  const MG=['민준','서준','도윤','예준','시우','주원','하준','지호','준서','현우','성민','재훈','동현','상우','영호','정훈','태영','승현','종민','기현','병철','진우','광수','용준','석진','명수','인호','대성','경민','우진','형석','찬호','규태','상철','윤재'];
  const FG=['서연','지우','서윤','민서','하은','지민','수빈','예은','은지','미영','수진','현정','혜진','지영','은영','선희','미경','정희','윤희','소연','유진','다은','보람','경아','주희','나연'];
  const used=new Set();
  const nm=g=>{let n;do{n=pick(SUR)+pick(g==='M'?MG:FG)}while(used.has(n));used.add(n);return n};
  const clubsDef=[['동탄센트럴테니스','동탄1동'],['반석산클럽','동탄2동'],['병점에이스','병점1동'],['봉담러브올','봉담읍'],['향남스매싱','향남읍'],['남양듀스','남양읍'],['새솔발리','새솔동'],['송산그린','송산면'],['동탄호수공원클럽','동탄7동'],['진안로브','진안동']];
  const clubs=clubsDef.map((c,i)=>({id:'c'+(i+1),name:c[0],area:c[1],leader:'',phone:`010-${rint(2000,9899)}-${rint(1000,9999)}`,founded:2005+rint(0,18)}));
  const members=[];let mi=1;
  clubs.forEach(c=>{
    const nM=rint(7,9),nF=rint(4,5);
    for(let k=0;k<nM+nF;k++){
      const g=k<nM?'M':'F';
      members.push({id:'m'+(mi++),name:nm(g),gender:g,birth:g==='M'?rint(1962,1996):rint(1968,1994),clubId:c.id,
        phone:`010-${rint(2000,9899)}-${rint(1000,9999)}`,level:g==='M'?(R()<.4?'오픈':'신인'):(R()<.45?'국화':'개나리'),joined:`20${rint(15,26)}-0${rint(1,9)}-1${rint(0,9)}`});
    }
    c.leader=members.filter(m=>m.clubId===c.id)[0].name;
  });
  const S={v:2,clubs,members,tournaments:[],entries:[],groups:{},matches:[],notices:[],history:[]};

  // 지난 대회 성적 (시즌 랭킹용)
  const past=[['제8회 봉담배 테니스대회','2026-04-12'],['제3회 향남 오픈','2026-06-21'],['2026 시민 체육대회 테니스','2026-09-06']];
  past.forEach(([tn,date])=>{
    ['M','F'].forEach(g=>{
      const pool=members.filter(m=>m.gender===g).sort(()=>R()-.5);
      const nTeams=g==='M'?16:8, finishes=g==='M'?['우승','준우승','4강','4강','8강','8강','8강','8강','예선','예선','예선','예선','예선','예선','예선','예선']:['우승','준우승','4강','4강','예선','예선','예선','예선'];
      for(let t=0;t<nTeams;t++){
        const f=finishes[t];[pool[t*2],pool[t*2+1]].forEach(m=>m&&S.history.push({memberId:m.id,tname:tn,date,div:g==='M'?'남자부':'여자부',finish:f,pts:PTS[f]}));
      }
    });
  });

  const DIVS={
    mo:{id:'mo',name:'남자 오픈부',gender:'M',levels:['오픈','신인'],groupSize:4,advance:2},
    mn:{id:'mn',name:'남자 신인부',gender:'M',levels:['신인'],groupSize:3,advance:2},
    fk:{id:'fk',name:'여자 국화부',gender:'F',levels:['국화','개나리'],groupSize:4,advance:2},
    fg:{id:'fg',name:'여자 개나리부',gender:'F',levels:['개나리'],groupSize:4,advance:2}
  };
  const tA={id:'t12',name:'제12회 시장배 생활체육 테니스대회',date:TODAY,venue:'동탄센트럴파크 테니스장',courts:8,start:'08:30',slotMin:40,fee:40000,
    regStart:'2026-09-21',regEnd:'2026-10-10',status:'진행중',host:'시체육회',organizer:'테니스협회',
    rule:'6게임 노애드, 5:5 타이브레이크(7포인트). 조별리그 후 각 조 1·2위 본선 토너먼트.',divisions:[DIVS.mo,DIVS.mn,DIVS.fg].map(d=>({...d}))};
  const tB={id:'t13',name:'제5회 동탄호수공원배 테니스대회',date:'2026-11-15',venue:'동탄호수공원 테니스장',courts:6,start:'09:00',slotMin:40,fee:40000,
    regStart:'2026-10-12',regEnd:'2026-11-06',status:'접수중',host:'테니스협회',organizer:'동탄호수공원클럽',
    rule:'6게임 노애드, 5:5 타이브레이크(7포인트). 조별리그 후 각 조 1·2위 본선 토너먼트.',divisions:[DIVS.mo,DIVS.mn,DIVS.fk,DIVS.fg].map(d=>({...d}))};
  const tC={id:'t14',name:'2026 협회장기 시즌 파이널',date:'2026-12-06',venue:'종합경기타운 테니스장',courts:8,start:'08:30',slotMin:40,fee:50000,
    regStart:'2026-11-16',regEnd:'2026-11-27',status:'접수예정',host:'테니스협회',organizer:'테니스협회',
    rule:'시즌 랭킹 상위 팀 우선 시드 배정.',divisions:[DIVS.mo,DIVS.fk].map(d=>({...d}))};
  S.tournaments=[tA,tB,tC];

  // 참가팀 구성
  const usedIn={};
  const makeTeams=(t,div,n,statusFn)=>{
    usedIn[t.id]=usedIn[t.id]||new Set();
    const pool=members.filter(m=>m.gender===div.gender&&div.levels.includes(m.level)&&!usedIn[t.id].has(m.id)).sort(()=>R()-.5);
    for(let k=0;k<n&&pool.length>=2;k++){
      const a=pool.shift();let bi=pool.findIndex(m=>m.clubId===a.clubId);if(bi<0||R()<.3)bi=0;const b=pool.splice(bi,1)[0];
      usedIn[t.id].add(a.id);usedIn[t.id].add(b.id);
      const st=statusFn(k);
      S.entries.push({id:'e'+(S.entries.length+1),tid:t.id,divId:div.id,p1:a.id,p2:b.id,status:st,paid:st==='승인',created:t.regStart});
    }
  };
  makeTeams(tA,tA.divisions[0],16,()=> '승인');
  makeTeams(tA,tA.divisions[1],12,()=> '승인');
  makeTeams(tA,tA.divisions[2],8,()=> '승인');
  makeTeams(tB,tB.divisions[0],7,k=>k<5?'승인':'대기');
  makeTeams(tB,tB.divisions[1],5,k=>k<3?'승인':'대기');
  makeTeams(tB,tB.divisions[2],3,()=> '승인');
  makeTeams(tB,tB.divisions[3],4,k=>k<3?'승인':'대기');

  S.notices=[
    {id:'n0',pin:true,date:'2026-10-19',title:'시립코트 예약 및 우천 취소 안내',body:'시립 테니스장 4곳(동탄센트럴파크, 종합경기타운, 봉담 클레이, 남양)은 홈페이지에서 2시간 단위로 예약합니다.\n\n매주 월요일 10:00에 다음 주 예약이 열리며 1인당 하루 2타임까지 가능합니다. 우천·코트 사정으로 이용하지 못한 경우 [우천 등 예약취소]에서 요청하시면 전액 환불됩니다.'},
    {id:'n1',pin:true,date:'2026-10-11',title:'제12회 시장배 대진표 및 코트 배정 안내',body:'대진표와 코트·경기시간이 확정되었습니다. 대회 페이지의 대진표 메뉴 또는 [내 경기 확인]에서 이름으로 조회하실 수 있습니다.\n\n경기 시작 20분 전까지 본부석에서 출석 확인을 해주세요.'},
    {id:'n2',pin:false,date:'2026-10-12',title:'제5회 동탄호수공원배 참가 접수 시작',body:'11월 6일(금)까지 홈페이지에서 접수합니다. 협회 등록 회원만 참가 가능하며 복식 파트너도 등록 회원이어야 합니다.\n\n참가비: 팀당 40,000원 (농협 000-0000-0000-00 테니스협회)'},
    {id:'n3',pin:false,date:'2026-09-30',title:'2027년도 클럽 등록 및 회원 갱신 안내',body:'2027년도 클럽 등록은 12월 1일부터 진행됩니다. 클럽 대표자는 회원 명단을 엑셀 양식으로 제출해 주세요.'},
    {id:'n4',pin:false,date:'2026-09-08',title:'2026 시민 체육대회 테니스 종목 결과',body:'참가해 주신 모든 회원께 감사드립니다. 결과는 시즌 랭킹에 반영되었습니다.'}
  ];

  // 진행중 대회: 조편성 → 일정 → 결과 시뮬레이션
  window.__S=S;
  tA.divisions.forEach(d=>makeGroups(S,tA.id,d.id));
  scheduleAll(S,tA.id);
  const str=e=>teamPts(S,e)+R()*60;
  const sim=m=>{const ea=m.a,eb=m.b;const aw=str(ea)>=str(eb);const lo=rint(1,5);setResultRaw(S,m,aw?6:lo,aw?lo:6)};
  S.matches.filter(m=>m.tid===tA.id&&m.stage==='G').forEach(m=>{ if(!(m.divId==='mn'&&m.round>=2)) sim(m) });
  makeKO(S,tA.id,'mo'); makeKO(S,tA.id,'fg');
  scheduleAll(S,tA.id);
  S.matches.filter(m=>m.tid===tA.id&&m.stage==='K'&&m.divId==='mo'&&m.round===1).forEach(sim);
  S.matches.filter(m=>m.tid===tA.id&&m.stage==='K'&&m.divId==='fg'&&m.round===1).slice(0,1).forEach(sim);
  seedCourts(S);
  return S;
}
const PTS={'우승':100,'준우승':70,'4강':50,'8강':30,'16강':20,'32강':15,'예선':10};

/* ============ 조회 헬퍼 ============ */
let S;
const M=id=>S.members.find(m=>m.id===id);
const C=id=>S.clubs.find(c=>c.id===id);
const T=id=>S.tournaments.find(t=>t.id===id);
const E=id=>S.entries.find(e=>e.id===id);
const DV=(t,divId)=>t.divisions.find(d=>d.id===divId);
const clubName=m=>m?(C(m.clubId)?.name||'-'):'-';
function teamName(eid,withClub){
  const e=typeof eid==='object'?eid:E(eid); if(!e) return '';
  const a=M(e.p1),b=M(e.p2);
  if(!withClub) return `${a?.name||'?'}·${b?.name||'?'}`;
  const ca=clubName(a),cb=clubName(b);
  return `${a?.name||'?'}·${b?.name||'?'}`+`<small>${esc(ca===cb?ca:ca+' / '+cb)}</small>`;
}
const teamHTML=eid=>eid?`<span class="team">${teamName(eid,true)}</span>`:'<span class="team muted">미정</span>';
function memberPts(S_,mid){return seasonRecords(S_).filter(r=>r.memberId===mid).reduce((s,r)=>s+r.pts,0)}
function teamPts(S_,eid){const e=S_.entries.find(x=>x.id===eid);return memberPts(S_,e.p1)+memberPts(S_,e.p2)}
const slotTime=(t,slot)=>{if(slot==null)return '-';const [h,m]=t.start.split(':').map(Number);const x=h*60+m+slot*t.slotMin;return `${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`};
const GN=i=>String.fromCharCode(65+i);
const roundName=teams=>teams===2?'결승':teams+'강';

/* ============ 조편성 · 조별리그 ============ */
function roundRobin(ids){
  const a=[...ids]; if(a.length%2) a.push(null);
  const n=a.length, rounds=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i]; if(x&&y) pairs.push([x,y]);}
    rounds.push(pairs); a.splice(1,0,a.pop());
  }
  return rounds;
}
function makeGroups(S_,tid,divId){
  const t=S_.tournaments.find(x=>x.id===tid), d=t.divisions.find(x=>x.id===divId);
  const teams=S_.entries.filter(e=>e.tid===tid&&e.divId===divId&&e.status==='승인');
  // 시드: 시즌 포인트 합 높은 순 → 스네이크 배정, 같은 클럽은 가급적 분산
  const sorted=teams.map(e=>({e,p:teamPts(S_,e.id)})).sort((x,y)=>y.p-x.p).map(x=>x.e);
  const G=Math.max(1,Math.round(sorted.length/d.groupSize));
  const groups=Array.from({length:G},(_,i)=>({name:GN(i),teams:[]}));
  sorted.forEach((e,i)=>{const row=Math.floor(i/G);const col=row%2?G-1-(i%G):i%G;groups[col].teams.push(e.id)});
  S_.groups[tid+'|'+divId]=groups;
  S_.matches=S_.matches.filter(m=>!(m.tid===tid&&m.divId===divId));
  groups.forEach(g=>{
    roundRobin(g.teams).forEach((pairs,ri)=>pairs.forEach(([a,b])=>{
      S_.matches.push({id:uid('g'),tid,divId,stage:'G',group:g.name,round:ri+1,idx:0,a,b,sa:null,sb:null,winner:null,status:'예정',slot:null,court:null});
    }));
  });
}
function standings(S_,tid,divId,gname){
  const g=(S_.groups[tid+'|'+divId]||[]).find(x=>x.name===gname); if(!g) return [];
  const ms=S_.matches.filter(m=>m.tid===tid&&m.divId===divId&&m.stage==='G'&&m.group===gname);
  const row={}; g.teams.forEach(id=>row[id]={id,P:0,W:0,L:0,GF:0,GA:0});
  ms.filter(m=>m.status==='완료').forEach(m=>{
    const A=row[m.a],B=row[m.b]; if(!A||!B) return;
    A.P++;B.P++;A.GF+=m.sa;A.GA+=m.sb;B.GF+=m.sb;B.GA+=m.sa;
    if(m.winner===m.a){A.W++;B.L++}else{B.W++;A.L++}
  });
  const list=Object.values(row).map(r=>({...r,D:r.GF-r.GA}));
  list.sort((x,y)=>y.W-x.W||y.D-x.D||y.GF-x.GF);
  // 2팀 동률(승수) → 승자승
  for(let i=0;i<list.length-1;i++){
    const same=list.filter(r=>r.W===list[i].W);
    if(same.length===2&&list[i+1].W===list[i].W){
      const h=ms.find(m=>m.status==='완료'&&((m.a===list[i].id&&m.b===list[i+1].id)||(m.b===list[i].id&&m.a===list[i+1].id)));
      if(h&&h.winner===list[i+1].id){[list[i],list[i+1]]=[list[i+1],list[i]];list[i].h2h=true}
      else if(h) list[i].h2h=true;
      i++;
    }
  }
  const done=ms.length>0&&ms.every(m=>m.status==='완료');
  list.forEach((r,i)=>{r.rank=i+1;r.done=done});
  return list;
}
const groupStageDone=(S_,tid,divId)=>{const ms=S_.matches.filter(m=>m.tid===tid&&m.divId===divId&&m.stage==='G');return ms.length>0&&ms.every(m=>m.status==='완료')};

/* ============ 본선 토너먼트 ============ */
function seedOrder(P){let a=[1];while(a.length<P){const n=a.length*2;a=a.flatMap(x=>[x,n+1-x])}return a}
function makeKO(S_,tid,divId){
  const t=S_.tournaments.find(x=>x.id===tid), d=t.divisions.find(x=>x.id===divId);
  const groups=S_.groups[tid+'|'+divId]||[]; const G=groups.length;
  const st=groups.map(g=>standings(S_,tid,divId,g.name));
  const seeds=[];
  st.forEach((s,i)=>seeds[i+1]=s[0]?.id);
  if(d.advance>=2) for(let i=1;i<=G;i++) seeds[2*G+1-i]=st[i%G][1]?.id;
  const Q=d.advance>=2?2*G:G; let P=1; while(P<Q)P*=2;
  if(P<2)P=2;
  S_.matches=S_.matches.filter(m=>!(m.tid===tid&&m.divId===divId&&m.stage==='K'));
  const order=seedOrder(P), R=Math.log2(P), ko=[];
  for(let r=1;r<=R;r++){
    const n=P/2**r;
    for(let k=0;k<n;k++){
      const m={id:uid('k'),tid,divId,stage:'K',group:null,round:r,idx:k,size:P/2**(r-1),a:null,b:null,sa:null,sb:null,winner:null,status:'예정',slot:null,court:null};
      if(r===1){m.a=seeds[order[2*k]]||null;m.b=seeds[order[2*k+1]]||null;m.seedA=order[2*k];m.seedB=order[2*k+1]}
      ko.push(m);
    }
  }
  S_.matches.push(...ko);
  ko.filter(m=>m.round===1&&(!m.a||!m.b)).forEach(m=>{m.status='부전';m.winner=m.a||m.b;advance(S_,m)});
}
function nextOf(S_,m){return S_.matches.find(x=>x.tid===m.tid&&x.divId===m.divId&&x.stage==='K'&&x.round===m.round+1&&x.idx===Math.floor(m.idx/2))}
function advance(S_,m){const n=nextOf(S_,m);if(!n)return;n[m.idx%2===0?'a':'b']=m.winner||null}
function validScore(a,b){
  if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0) return '점수를 숫자로 입력하세요';
  if(a===b) return '동점은 입력할 수 없습니다';
  const hi=Math.max(a,b),lo=Math.min(a,b);
  if(hi!==6&&hi!==7) return '이긴 팀 점수는 6(또는 7)이어야 합니다';
  if(hi===6&&lo>5) return '6게임 경기에서 진 팀 점수는 0~5입니다';
  if(hi===7&&lo<5) return '7게임은 7:5, 7:6일 때만 가능합니다';
  return '';
}
function setResultRaw(S_,m,sa,sb){
  m.sa=sa;m.sb=sb;m.winner=sa>sb?m.a:m.b;m.status='완료';
  if(m.stage==='K') advance(S_,m);
}
function clearResult(S_,m){
  if(m.stage==='K'){const n=nextOf(S_,m);if(n&&n.status==='완료') return '다음 라운드 경기가 이미 끝나 수정할 수 없습니다. 다음 경기 결과부터 지워주세요.'; if(n) n[m.idx%2===0?'a':'b']=null}
  m.sa=m.sb=m.winner=null;m.status='예정';return '';
}
function divisionDone(S_,tid,divId){const ks=S_.matches.filter(m=>m.tid===tid&&m.divId===divId&&m.stage==='K');const f=ks.find(m=>m.size===2);return !!(f&&f.status==='완료')}

/* ============ 코트 · 시간 자동 배정 ============ */
function scheduleAll(S_,tid,reset){
  const t=S_.tournaments.find(x=>x.id===tid);
  const ms=S_.matches.filter(m=>m.tid===tid&&m.status!=='부전');
  if(reset) ms.filter(m=>m.status!=='완료').forEach(m=>{m.slot=null;m.court=null});
  const courtAt={}, teamAt={}, load={};
  const mark=m=>{(courtAt[m.slot]=courtAt[m.slot]||new Set()).add(m.court);[m.a,m.b].forEach(x=>{if(x)(teamAt[x]=teamAt[x]||new Set()).add(m.slot)})};
  ms.filter(m=>m.slot!=null).forEach(m=>{mark(m);load[m.court]=(load[m.court]||0)+1});
  const divOrder=t.divisions.map(d=>d.id);
  const todo=ms.filter(m=>m.slot==null).sort((x,y)=>(x.stage===y.stage?0:x.stage==='G'?-1:1)||x.round-y.round||divOrder.indexOf(x.divId)-divOrder.indexOf(y.divId)||String(x.group).localeCompare(String(y.group))||x.idx-y.idx);
  const busy=(id,s)=>teamAt[id]&&teamAt[id].has(s);
  todo.forEach(m=>{
    let min=0;
    if(m.stage==='K'){
      if(m.round===1){S_.matches.filter(x=>x.tid===tid&&x.divId===m.divId&&x.stage==='G'&&x.slot!=null).forEach(x=>min=Math.max(min,x.slot+1))}
      else S_.matches.filter(x=>x.tid===tid&&x.divId===m.divId&&x.stage==='K'&&x.round===m.round-1&&Math.floor(x.idx/2)===m.idx).forEach(f=>{if(f.slot!=null)min=Math.max(min,f.slot+2)});
    }
    const teams=[m.a,m.b].filter(Boolean);
    for(let s=min;s<400;s++){
      const used=courtAt[s]||new Set(); if(used.size>=t.courts) continue;
      if(teams.some(x=>busy(x,s-1)||busy(x,s)||busy(x,s+1))) continue;
      let c=0; for(let k=1;k<=t.courts;k++){ if(!used.has(k)&&(!c||(load[k]||0)<(load[c]||0))) c=k }
      load[c]=(load[c]||0)+1;
      m.slot=s;m.court=c;mark(m);break;
    }
  });
}

/* ============ 랭킹 ============ */
function tournamentRecords(S_){
  const out=[];
  S_.tournaments.forEach(t=>t.divisions.forEach(d=>{
    if(!divisionDone(S_,t.id,d.id)) return;
    const ks=S_.matches.filter(m=>m.tid===t.id&&m.divId===d.id&&m.stage==='K');
    const fin={};
    ks.forEach(m=>{if(m.status==='완료'){const lo=m.winner===m.a?m.b:m.a;fin[lo]=m.size===2?'준우승':roundName(m.size)} if(m.size===2&&m.winner)fin[m.winner]='우승'});
    S_.entries.filter(e=>e.tid===t.id&&e.divId===d.id&&e.status==='승인').forEach(e=>{
      const f=fin[e.id]||'예선';
      [e.p1,e.p2].forEach(mid=>out.push({memberId:mid,tname:t.name,date:t.date,div:d.name,finish:f,pts:PTS[f]||10}));
    });
  }));
  return out;
}
function seasonRecords(S_){return [...S_.history,...tournamentRecords(S_)].filter(r=>r.date.startsWith('2026'))}

function courtBoard(t){
  const ms=S.matches.filter(m=>m.tid===t.id&&m.status==='예정'&&m.slot!=null);
  const live=ms.length?Math.min(...ms.map(m=>m.slot)):null;
  const done=S.matches.filter(m=>m.tid===t.id&&m.status==='완료').length, total=S.matches.filter(m=>m.tid===t.id&&m.status!=='부전').length;
  let cells='';
  for(let c=1;c<=t.courts;c++){
    const m=ms.filter(x=>x.court===c).sort((x,y)=>x.slot-y.slot)[0];
    if(!m){cells+=`<div class="court"><span class="cl"></span><span class="no">${c}</span><span class="idle">경기 없음</span></div>`;continue}
    const d=DV(t,m.divId);
    cells+=`<div class="court" title="${esc(d.name)}"><span class="cl"></span><span class="no">${c}</span>${m.slot===live?'<span class="live">경기중</span>':`<span class="live" style="background:#fff;color:#173f6c">${slotTime(t,m.slot)}</span>`}
      <span class="side a">${m.a?esc(teamName(m.a)):'미정'}</span><span class="side b">${m.b?esc(teamName(m.b)):'미정'}</span></div>`;
  }
  return `<div class="court-board"><div class="court-board-head"><b>${esc(t.name)} 코트 현황</b><span>${done}/${total} 경기 종료</span></div><div class="courts">${cells}</div></div>`;
}
function matchCard(m,t,hl){

function bracket(t,divId){
  const ks=S.matches.filter(m=>m.tid===t.id&&m.divId===divId&&m.stage==='K');
  if(!ks.length) return `<div class="empty">조별리그가 끝나면 본선 대진이 생성됩니다.</div>`;
  const R=Math.max(...ks.map(m=>m.round));
  const slotH=(m,side)=>{const id=m[side],sc=side==='a'?m.sa:m.sb;const win=m.winner&&m.winner===id&&m.status!=='예정';
    if(!id) return `<div class="slot tbd"><span>${m.status==='부전'?'부전':'미정'}</span><span></span></div>`;
    return `<div class="slot ${win?'win':''}"><span>${esc(teamName(id))}</span><span class="sc">${m.status==='완료'?sc:''}</span></div>`};
  const cols=[];
  for(let r=1;r<=R;r++){
    const rs=ks.filter(m=>m.round===r).sort((x,y)=>x.idx-y.idx);
    cols.push(`<div class="b-round"><h4>${roundName(rs[0].size)}</h4><div class="b-col">${rs.map(m=>`<div class="b-match">${slotH(m,'a')}${slotH(m,'b')}<div class="b-meta">${m.status==='부전'?'부전승':`${slotTime(t,m.slot)} · ${m.court||'-'}번 코트`}</div></div>`).join('')}</div></div>`);
  }
  const f=ks.find(m=>m.size===2);
  if(f&&f.status==='완료') cols.push(`<div class="b-round"><h4>우승</h4><div class="b-col"><div class="champion">🏆 ${esc(teamName(f.winner))}<div class="small" style="font-weight:500">${esc(clubName(M(E(f.winner).p1)))}</div></div></div></div>`);
  return `<div class="bracket-scroll"><div class="bracket">${cols.join('')}</div></div>`;
}

function pageT(tid,tab){
  const t=T(tid); if(!t) return '<div class="empty">대회를 찾을 수 없습니다.</div>';
  tab=tab||(['진행중','종료'].includes(t.status)?'draw':'info');
  const tabs=[['info','대회 요강'],['entries','참가 현황'],['draw','대진표'],['schedule','경기 일정']];
  let body='';
  if(tab==='info') body=`<div class="grid-2"><section class="panel"><h2>대회 요강</h2><table><tbody>
    ${[['일시',fmtDateLong(t.date)+' '+t.start+' 첫 경기'],['장소',t.venue+' (코트 '+t.courts+'면)'],['주최 / 주관',t.host+' / '+t.organizer],['접수 기간',t.regStart+' ~ '+t.regEnd],['참가비','팀당 '+fmtWon(t.fee)],['경기 방식',t.rule]].map(([a,b])=>`<tr><th style="width:110px">${a}</th><td style="white-space:normal">${esc(b)}</td></tr>`).join('')}</tbody></table></section>
    <section class="panel"><h2>참가 부서</h2><ul class="list">${t.divisions.map(d=>`<li><span>${esc(d.name)} <span class="muted small">${d.levels.join('·')} 등급</span></span><span class="meta">${S.entries.filter(e=>e.tid===t.id&&e.divId===d.id&&e.status!=='취소').length}팀</span></li>`).join('')}</ul>
    ${t.status==='접수중'?`<a class="btn primary mt" href="#/apply/${t.id}">이 대회 접수하기</a>`:''}</section></div>`;
  if(tab==='entries') body=t.divisions.map(d=>{const es=S.entries.filter(e=>e.tid===t.id&&e.divId===d.id&&e.status!=='취소');
    return `<section class="panel"><div class="panel-head"><h3>${esc(d.name)}</h3><span class="muted small">${es.length}팀</span></div>${es.length?`<div class="tbl-wrap"><table><thead><tr><th>번호</th><th>선수</th><th>소속</th><th>상태</th></tr></thead><tbody>${es.map((e,i)=>`<tr><td class="num">${i+1}</td><td>${esc(teamName(e))}</td><td class="muted">${esc(clubName(M(e.p1)))}${M(e.p1).clubId!==M(e.p2).clubId?' / '+esc(clubName(M(e.p2))):''}</td><td>${entryTag(e.status)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">아직 접수한 팀이 없습니다.</p>'}</section>`}).join('');
  if(tab==='draw'){
    const cur=ui.div[t.id]||t.divisions[0].id; const groups=S.groups[t.id+'|'+cur]||[];
    body=chips(t.divisions.map(d=>[d.id,d.name]),cur,'pickDiv',`data-t="${t.id}"`)+
      (groups.length?`<h2>조별리그</h2><p class="muted small">승수 → 2팀 동률 시 승자승 → 게임 득실차 → 득점 순. 초록 표시는 본선 진출.</p><div class="groups">${groups.map(g=>groupTable(t,cur,g)).join('')}</div><h2 class="mt">본선 토너먼트</h2>${bracket(t,cur)}`
      :`<div class="empty">대진표는 접수 마감 후 공개됩니다.</div>`);
  }
  if(tab==='schedule') body=scheduleGrid(t,ui.sched[t.id]||'all',false);
  return `<div class="page-head"><div><h1>${esc(t.name)}</h1><p>${fmtDateLong(t.date)} · ${esc(t.venue)} ${statusTag(t.status)}</p></div>${t.status==='접수중'?`<a class="btn primary" href="#/apply/${t.id}">접수하기</a>`:''}</div>
  <nav class="tabs">${tabs.map(([k,l])=>`<a href="#/t/${t.id}/${k}" class="${k===tab?'on':''}">${l}</a>`).join('')}</nav>${body}`;
}

function scheduleGrid(t,div,admin){
  const ms=S.matches.filter(m=>m.tid===t.id&&m.slot!=null&&m.status!=='부전'&&(div==='all'||m.divId===div));
  const head=chips([['all','전체'],...t.divisions.map(d=>[d.id,d.name])],div,'pickSched',`data-t="${t.id}"`);
  if(!ms.length) return head+'<div class="empty">배정된 경기가 없습니다.</div>';
  const maxS=Math.max(...ms.map(m=>m.slot));
  let rows='';
  for(let s=0;s<=maxS;s++){
    const cells=[];for(let c=1;c<=t.courts;c++){const m=ms.find(x=>x.slot===s&&x.court===c);
      cells.push(`<td>${m?`<div class="cell ${m.status==='완료'?'done':''}" ${admin?`data-act="editSlot" data-id="${m.id}" style="cursor:pointer"`:''}><b>${esc(DV(t,m.divId).name.replace(/^(남자|여자) /,''))} ${m.stage==='G'?m.group+'조':roundName(m.size)}</b>${m.a?esc(teamName(m.a)):'미정'}<br>${m.b?esc(teamName(m.b)):'미정'}${m.status==='완료'?`<br><b style="color:var(--ok)">${m.sa}:${m.sb}</b>`:''}</div>`:''}</td>`)}
    rows+=`<tr><td class="num"><b>${slotTime(t,s)}</b></td>${cells.join('')}</tr>`;
  }
  return head+`<div class="tbl-wrap"><table class="sched"><thead><tr><th>시간</th>${Array.from({length:t.courts},(_,i)=>`<th>${i+1}번 코트</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

  const found=q?S.members.filter(m=>m.name.includes(q)):[];

  let res='';
  if(q&&!found.length) res=`<div class="empty">'${esc(q)}' 이름의 등록 회원이 없습니다. 이름을 다시 확인해 주세요.</div>`;
  else if(found.length>1&&!found.find(m=>m.id===ui.myPick)) res=`<section class="panel"><h3>동명이인이 있습니다. 본인을 선택하세요.</h3><div class="btns">${found.map(m=>`<button class="btn" data-act="myPick" data-id="${m.id}">${esc(m.name)} · ${esc(clubName(m))} · ${m.birth}년생</button>`).join('')}</div></section>`;
  else if(found.length){
    const me=found.length===1?found[0]:found.find(m=>m.id===ui.myPick);
    const es=S.entries.filter(e=>(e.p1===me.id||e.p2===me.id)&&e.status!=='취소');
    res=`<section class="panel" style="margin-bottom:16px"><div class="panel-head"><h2>${esc(me.name)} <span class="muted small" style="font-weight:400">${esc(clubName(me))} · ${me.level} 등급</span></h2><span class="tag ball">시즌 ${memberPts(S,me.id)}P</span></div></section>`+
    (es.length?es.map(e=>{const t=T(e.tid),d=DV(t,e.divId);
      const ms=S.matches.filter(m=>m.tid===t.id&&(m.a===e.id||m.b===e.id)&&m.status!=='부전').sort((x,y)=>(x.slot??999)-(y.slot??999));
      const g=(S.groups[t.id+'|'+d.id]||[]).find(g=>g.teams.includes(e.id));
      return `<h2 class="mt">${esc(t.name)}</h2><p class="muted small" style="margin-top:-6px">${fmtDateLong(t.date)} · ${esc(t.venue)} · ${esc(d.name)} · 파트너 ${esc(M(e.p1===me.id?e.p2:e.p1).name)} ${entryTag(e.status)}</p>
      ${ms.length?ms.map(m=>matchCard(m,t,e.id)).join(''):`<div class="empty">${e.status==='대기'?'참가비 확인 후 참가가 확정됩니다.':'대진표가 공개되면 이곳에 경기 시간과 코트가 표시됩니다.'}</div>`}
      ${g?`<div style="max-width:520px" class="mt">${groupTable(t,d.id,g,e.id)}</div>`:''}`}).join('')
    :`<div class="empty">참가 중인 대회가 없습니다. <a href="#/tournaments">대회 목록</a>에서 접수할 수 있습니다.</div>`);
  }
  return `<div class="page-head"><div><h1>내 경기 확인</h1><p>이름으로 조회하면 경기 시간, 코트, 상대 팀과 결과를 보여줍니다.</p></div></div>

}

function rankRows(g){
  const recs=seasonRecords(S); const by={};
  recs.forEach(r=>{const m=M(r.memberId);if(!m||m.gender!==g)return;(by[m.id]=by[m.id]||{id:m.id,name:m.name,club:clubName(m),pts:0,n:0,best:'',wins:0}); const o=by[m.id];o.pts+=r.pts;o.n++;if(r.finish==='우승')o.wins++;if(!o.best||PTS[r.finish]>PTS[o.best])o.best=r.finish});
  const list=Object.values(by).sort((a,b)=>b.pts-a.pts||b.wins-a.wins||a.name.localeCompare(b.name));
  list.forEach((r,i)=>r.rank=i>0&&list[i-1].pts===r.pts&&list[i-1].wins===r.wins?list[i-1].rank:i+1);
  return list;
}
function clubRank(){
  const recs=seasonRecords(S),by={};S.clubs.forEach(c=>by[c.id]={id:c.id,name:c.name,area:c.area,pts:0,wins:0});
  recs.forEach(r=>{const m=M(r.memberId);if(m&&by[m.clubId]){by[m.clubId].pts+=r.pts;if(r.finish==='우승')by[m.clubId].wins++}});
  const l=Object.values(by).sort((a,b)=>b.pts-a.pts);l.forEach((r,i)=>r.rank=i+1);return l;
}
function pageRanking(){
  const tab=ui.rank;
  const tabs=[['M','남자 개인'],['F','여자 개인'],['C','클럽']];
  let tbl;
  if(tab==='C') tbl=`<table><thead><tr><th class="c">순위</th><th>클럽</th><th>지역</th><th class="r">우승</th><th class="r">포인트</th></tr></thead><tbody>${clubRank().map(r=>`<tr class="rank-${r.rank}"><td class="c"><span class="medal">${r.rank}</span></td><td>${esc(r.name)}</td><td class="muted">${esc(r.area)}</td><td class="r num">${r.wins}</td><td class="r num"><b>${r.pts}</b></td></tr>`).join('')}</tbody></table>`;
  else tbl=`<table><thead><tr><th class="c">순위</th><th>이름</th><th>클럽</th><th class="r">출전</th><th>최고 성적</th><th class="r">포인트</th></tr></thead><tbody>${rankRows(tab).map(r=>`<tr class="rank-${r.rank}" data-act="rankDetail" data-id="${r.id}" style="cursor:pointer"><td class="c"><span class="medal">${r.rank}</span></td><td>${esc(r.name)}</td><td class="muted">${esc(r.club)}</td><td class="r num">${r.n}</td><td>${r.best}</td><td class="r num"><b>${r.pts}</b></td></tr>`).join('')}</tbody></table>`;
  return `<div class="page-head"><div><h1>2026 시즌 랭킹</h1><p>대회 성적별 포인트를 합산합니다. 우승 100 · 준우승 70 · 4강 50 · 8강 30 · 16강 20 · 예선 참가 10</p></div><button class="btn" data-act="xlsRank">엑셀 다운로드</button></div>
  <nav class="tabs">${tabs.map(([k,l])=>`<button class="${k===tab?'on':''}" data-act="rankTab" data-v="${k}">${l}</button>`).join('')}</nav>
  <p class="muted small">본선 결승이 끝난 부서의 결과는 자동으로 포인트에 반영됩니다. 이름을 누르면 대회별 내역을 볼 수 있습니다.</p>
  <div class="tbl-wrap">${tbl}</div>`;
}

}

ACT.applySubmit=el=>{
  const t=T(el.dataset.t),d=DV(t,ui.applyDiv),err=m=>{$('#aErr').textContent=m};
  if(!ui.p1||!ui.p2) return err('신청자와 파트너를 모두 선택하세요.');

  const dup=[ui.p1,ui.p2].map(M).find(m=>S.entries.some(e=>e.tid===t.id&&e.status!=='취소'&&(e.p1===m.id||e.p2===m.id)));

};

function towers(R,x0,x1,base,minH,maxH,fill,win){
  let o='',x=x0;
  while(x<x1){const w=26+R()*34,h=minH+R()*(maxH-minH);o+=`<rect x="${x.toFixed(1)}" y="${(base-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}"/>`;
    if(win) for(let yy=base-h+8;yy<base-8;yy+=11) for(let xx=x+5;xx<x+w-6;xx+=8) if(R()<.28) o+=`<rect x="${xx.toFixed(1)}" y="${yy.toFixed(1)}" width="3" height="4" fill="${win}" opacity=".75"/>`;
    x+=w+4+R()*10;}
  return o;
}

function addDays(s,n){const d=dObj(s);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

const fee=(v,h)=>h>=18?v.feeNight:v.feeDay;
function seedCourts(S_){
  const R=mulberry(5150);
  S_.venues=[
    {id:'v1',name:'동탄센트럴파크 테니스장',area:'동탄',courts:8,surface:'하드',color:'#1f5591',apron:'#2e7a58',scene:'city',feeDay:6000,feeNight:9000},
    {id:'v2',name:'종합경기타운 테니스장',area:'향남',courts:6,surface:'하드',color:'#2f7a62',apron:'#24577f',scene:'hills',feeDay:6000,feeNight:9000},
    {id:'v3',name:'봉담 클레이 테니스장',area:'봉담',courts:4,surface:'클레이',color:'#c2643a',apron:'#ad5532',scene:'hills',feeDay:8000,feeNight:10000},
    {id:'v4',name:'남양 테니스장',area:'남양',courts:4,surface:'인조잔디',color:'#4f9a4a',apron:'#3c7d39',scene:'sea',feeDay:5000,feeNight:7000}];
  S_.reservations=[];let n=1;
  S_.venues.forEach(v=>WEEK.forEach((d,di)=>{const wk=[0,6].includes(dObj(d).getDay());
    HOURS.forEach(h=>{for(let c=1;c<=v.courts;c++){
      if(v.id==='v1'&&d===TODAY){S_.reservations.push({id:'R'+String(n++).padStart(4,'0'),venueId:v.id,date:d,hour:h,court:c,name:'협회 대회',phone:'',club:'',status:'대회',cancel:null,created:'2026-10-01'});continue}
      const p=(wk?.8:.45)*(h>=18||h<=8?1.1:.8)*(di<3?1:.65);
      if(R()<p){const m=S_.members[Math.floor(R()*S_.members.length)];S_.reservations.push({id:'R'+String(n++).padStart(4,'0'),venueId:v.id,date:d,hour:h,court:c,name:m.name,phone:m.phone,club:(S_.clubs.find(x=>x.id===m.clubId)||{}).name||'',status:'예약',cancel:null,created:addDays(d,-3)})}
    }})}));
  const reasons=['우천','우천','코트 사정(물웅덩이)','개인 사정'];
  S_.reservations.filter(r=>r.status==='예약'&&r.date<=addDays(TODAY,1)).slice(0,6).forEach((r,i)=>{
    r.cancel={reason:reasons[i%4],memo:i%4<2?'오전부터 비가 와서 코트 사용이 어렵습니다.':'',date:TODAY,status:i<3?'승인':'접수'};if(i<3)r.status='취소'});
}
function freeCount(v,d){const used=S.reservations.filter(r=>r.venueId===v.id&&r.date===d&&r.status!=='취소').length;return HOURS.length*v.courts-used}

}
ACT.av=el=>{ui.av=el.dataset.v;render()};
ACT.block=el=>{const{v,d}=el.dataset;S.reservations.push({id:'R'+String(S.reservations.length+1).padStart(4,'0'),venueId:v,date:d,hour:+el.dataset.h,court:+el.dataset.c,name:'협회 사용',phone:'',club:'',status:'대회',cancel:null,created:TODAY});save();toast('협회 사용으로 막았습니다');render(true)};
ACT.resInfo=el=>{const r=S.reservations.find(x=>x.id===el.dataset.id),v=V(r.venueId);
  modal(`<h2>예약 ${r.id}</h2><table><tbody><tr><th>코트</th><td>${esc(v.name)} ${r.court}번</td></tr><tr><th>일시</th><td>${fmtDateLong(r.date)} ${slotLabel(r.hour)}</td></tr><tr><th>예약자</th><td>${esc(r.name)} ${esc(r.club?'('+r.club+')':'')}</td></tr><tr><th>연락처</th><td>${esc(r.phone||'-')}</td></tr><tr><th>이용료</th><td>${r.status==='대회'?'-':fmtWon(fee(v,r.hour))}</td></tr></tbody></table>
  <div class="btns mt" style="justify-content:flex-end"><button class="btn" data-act="close">닫기</button><button class="btn danger" data-act="resDel" data-id="${r.id}">${r.status==='대회'?'막기 해제':'예약 취소'}</button></div>`)};
ACT.resDel=el=>{const r=S.reservations.find(x=>x.id===el.dataset.id);if(r.status==='대회')S.reservations=S.reservations.filter(x=>x!==r);else{r.status='취소';r.cancel=r.cancel||{reason:'관리자 취소',memo:'',date:TODAY,status:'승인'}}save();closeModal();toast('처리했습니다');render(true)};
ACT.cxOk=el=>{const r=S.reservations.find(x=>x.id===el.dataset.id);r.cancel.status='승인';r.status='취소';save();toast('취소·환불 처리했습니다');render()};
ACT.cxNo=el=>{const r=S.reservations.find(x=>x.id===el.dataset.id);r.cancel.status='반려';save();toast('반려했습니다');render()};
ACT.xlsRes=()=>exportXLSX('시립코트_예약내역.xlsx',Object.fromEntries(S.venues.map(v=>[v.name,S.reservations.filter(r=>r.venueId===v.id).sort((a,b)=>a.date.localeCompare(b.date)||a.hour-b.hour||a.court-b.court).map(r=>({예약번호:r.id,이용일:r.date,시간:slotLabel(r.hour),코트:r.court+'번',예약자:r.name,연락처:r.phone,소속:r.club,이용료:r.status==='대회'?0:fee(v,r.hour),상태:r.status==='대회'?'협회 사용':r.status,취소사유:r.cancel?r.cancel.reason:'',취소처리:r.cancel?r.cancel.status:''}))])));

/* ============ 라우터 ============ */
const NAV=[['','홈'],['about','협회 소개'],['notices','알려드립니다'],['tournaments','대회'],['courts','코트 예약'],['my','내 경기 확인'],['ranking','시즌 랭킹']];
function render(keepFocus){
  const h=location.hash.replace(/^#\/?/,''),p=h.split('/');
  const sec=p[0]||'';
  const focusId=keepFocus&&document.activeElement?document.activeElement.id:null;
  const focusInp=keepFocus&&document.activeElement?.dataset?.inp;
  $('#nav').innerHTML=NAV.map(([k,l])=>`<a href="#/${k}" class="${(sec===k||(k==='tournaments'&&['t','apply'].includes(sec))||(k==='notices'&&sec==='notice'))?'on':''}">${l}</a>`).join('')+`<a href="#/admin" class="admin ${sec==='admin'?'on':''}">관리자</a>`;
  $('#nav').classList.remove('open');
  let html='';
  if(sec==='admin'){
    if(!isAdmin){$('#adminStrip').innerHTML='';html=pageLogin()}
    else{
      const live=S.tournaments.find(t=>t.status==='진행중');
      const cx=S.reservations.filter(r=>r.cancel&&r.cancel.status==='접수').length;const items=[['','대시보드'],['members','개인 회원'],['clubs','클럽팀'],['tournaments','대회 관리'],['courts','코트 예약'+(cx?' ('+cx+')':'')]];
      if(live) items.push([`t/${live.id}/results`,'오늘 결과 입력']);
      const sub=p.slice(1).join('/');
      $('#adminStrip').innerHTML=`<div class="admin-strip"><div class="wrap">${items.map(([k,l])=>`<a href="#/admin${k?'/'+k:''}" class="${(sub===k||(k==='courts'&&p[1]==='courts')||(k==='tournaments'&&p[1]==='t'&&!(live&&sub===`t/${live.id}/results`)))?'on':''}">${l}</a>`).join('')}<span class="who">관리자<button data-act="logout">로그아웃</button></span></div></div>`;
      html=p[1]==='members'?pageAdminMembers():p[1]==='clubs'?pageAdminClubs():p[1]==='tournaments'?pageAdminTournaments():p[1]==='courts'?pageAdminCourts(p[2]):p[1]==='t'?pageAdminT(p[2],p[3]):pageAdminHome();
    }
  } else {
    $('#adminStrip').innerHTML='';
    html=sec==='about'?pageAbout():sec==='notices'?pageNotices():sec==='notice'?pageNotices(p[1]):sec==='tournaments'?pageTournaments():sec==='courts'?pageCourts(p[1]):sec==='t'?pageT(p[1],p[2]):sec==='apply'?pageApply(p[1]):sec==='my'?pageMy():sec==='ranking'?pageRanking():pageHome();
  }
  $('#app').innerHTML=html;
  if(focusInp){const el=document.querySelector(`[data-inp="${focusInp}"]`);if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
  else if(focusId){const el=document.getElementById(focusId);if(el)el.focus()}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act])ACT[el.dataset.act](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-inp]');if(el&&INP[el.dataset.inp])INP[el.dataset.inp](el,e)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='myQ')ACT.mySearch();if(e.key==='Escape')closeModal()});
$('#menuBtn').addEventListener('click',()=>$('#nav').classList.toggle('open'));
let lastHash=location.hash;
window.addEventListener('hashchange',()=>{closeModal();render();if(location.hash!==lastHash)scrollTo(0,0);lastHash=location.hash});
document.querySelector('.brand-mark').outerHTML=logoSVG;document.querySelector('.foot-logo').innerHTML=logoSVG;
S=load()||seed();save();render();
</script>
</body>
